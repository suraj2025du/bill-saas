# build-test.yml - lint, typecheck, unit + integration tests with the 80% coverage gate, build.
# Seeded from the sdlc-scaffold stub. Actions are pinned to commit SHAs (verified 2026-11-06).
name: build-test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No focused or skipped tests
        run: |
          if grep -rnE '\b(it|test|describe)\.(only|skip)\(' tests; then
            echo "::error::Remove .only / .skip before merging."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests (fails below 80% lines/branches/functions/statements)
        run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
